name: Publish LoginGuard v0.2.26 Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-v026:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release target
        uses: actions/checkout@v4
        with:
          ref: 29fb92698f7548e302ec50e3e932249b63a68445

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate
        run: bash scripts/validate.sh

      - name: Build Joomla package
        run: bash scripts/build.sh

      - name: Create v0.2.26 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view v0.2.26 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.2.26 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v0.2.26 \
            packages/pkg_loginguard_v0.2.26.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target 29fb92698f7548e302ec50e3e932249b63a68445 \
            --title "LoginGuard v0.2.26" \
            --notes "Compatibility release: restores LoginGuard runtime behavior to the known-good v0.2.20 baseline, keeps v0.2.26 release metadata, and retains dashboard-only presentation improvements. Joomla 5.4.6 administrator login with core Code by Email MFA was runtime-verified successfully before release."
