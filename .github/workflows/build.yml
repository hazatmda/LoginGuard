name: Build LoginGuard Package

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - codex/**
    tags:
      - 'v*'
  pull_request:
  release:
    types:
      - published

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Load canonical version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: Validate repository
        run: bash scripts/validate.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Load canonical version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate repository
        run: bash scripts/validate.sh
      - name: Build Joomla package
        run: bash scripts/build.sh
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoginGuard-package
          path: packages/pkg_loginguard_v${{ env.VERSION }}.zip

  publish-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate release tag
        run: |
          VERSION="$(cat VERSION)"
          test "${{ github.event.release.tag_name }}" = "v${VERSION}" || {
            echo "Release tag must equal v${VERSION}" >&2
            exit 1
          }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate repository
        run: bash scripts/validate.sh
      - name: Build Joomla package
        run: bash scripts/build.sh
      - name: Verify exact release package
        run: |
          VERSION="$(cat VERSION)"
          test -f "packages/pkg_loginguard_v${VERSION}.zip"
      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/pkg_loginguard_v${{ env.VERSION }}.zip
